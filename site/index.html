<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Baltic Lanes — Twenty years of Baltic shipping</title>
    <meta
      name="description"
      content="An animated map of 20 years of Baltic Sea shipping (2006–2026), built from the Danish Maritime Authority's open AIS archive. Aggregates only — no individual vessel tracking."
    />
    <meta property="og:title" content="Baltic Lanes — Twenty years of Baltic shipping" />
    <meta property="og:description" content="An animated map of 20 years of Baltic Sea shipping, from 3 TB of open AIS data." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#040a13" />
    <!-- BASEMAP_INLINE -->
    <script type="module">
      // Early paint: land + graticule on the 2D underlay canvas before the
      // maplibre bundle has downloaded/evaluated, so the map is visible fast.
      // The basemap GeoJSON is inlined above (window.__BASEMAP__), so no fetch
      // is needed. The initial view math must match src/view.ts fitView().
      // src/land.ts takes over with exact map projections once the map is up.
      const BBOX = [6, 52, 34, 67.5];
      const mercX = (lon) => (lon + 180) / 360;
      const mercY = (lat) => {
        const r = (lat * Math.PI) / 180;
        return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2;
      };
      const fitView = (w, h, padding = 24) => {
        const [minLon, minLat, maxLon, maxLat] = BBOX;
        const myTop = mercY(maxLat), myBot = mercY(minLat);
        const zLon = Math.log2(((w - 2 * padding) * 360) / ((maxLon - minLon) * 512));
        const zLat = Math.log2((h - 2 * padding) / ((myBot - myTop) * 512));
        const zoom = Math.min(zLon, zLat, 12);
        const centerLat = (2 * Math.atan(Math.exp(2 * Math.PI * (0.5 - (myTop + (myBot - myTop) / 2)))) - Math.PI / 2) * (180 / Math.PI);
        return { center: [(minLon + maxLon) / 2, centerLat], zoom };
      };
      const VIEW = fitView(window.innerWidth, window.innerHeight);
      const CENTER = VIEW.center;
      const ZOOM = VIEW.zoom;
      const project = (lon, lat, w, h) => {
        const world = 512 * 2 ** ZOOM; // maplibre world is 512 px at zoom 0
        return [
          (mercX(lon) - mercX(CENTER[0])) * world + w / 2,
          (mercY(lat) - mercY(CENTER[1])) * world + h / 2,
        ];
      };
      const canvas = document.getElementById('land');
      const ctx = canvas && canvas.getContext('2d');
      if (ctx && window.__BASEMAP__) {
        const polys = window.__BASEMAP__.land.features[0].geometry.coordinates;
        const lines = window.__BASEMAP__.grat.features[0].geometry.coordinates;
        const draw = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          if (!w || !h) return;
          if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
          }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          ctx.beginPath();
          for (const poly of polys) {
            for (const ring of poly) {
              ring.forEach(([lon, lat], i) => {
                const [x, y] = project(lon, lat, w, h);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              });
              ctx.closePath();
            }
          }
          ctx.fillStyle = '#16222f';
          ctx.fill('evenodd');
          ctx.strokeStyle = '#2c4257';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.beginPath();
          for (const line of lines) {
            line.forEach(([lon, lat], i) => {
              const [x, y] = project(lon, lat, w, h);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
          }
          ctx.strokeStyle = '#101f30';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        };
        draw();
        window.addEventListener('resize', draw);
      }
    </script>
    <script type="module" src="./src/main.ts" fetchpriority="high"></script>
  </head>
  <body>
    <div id="map" aria-label="Map of Baltic Sea shipping"><canvas id="land"></canvas></div>

    <header class="topbar">
      <!-- static so the text paints with first paint (LCP); ui.ts wires behavior -->
      <div id="chips" class="chips" role="group" aria-label="Vessel group filter">
        <button type="button" class="chip" data-group="all" disabled>All</button>
        <button type="button" class="chip" data-group="tanker" disabled>Tankers</button>
        <button type="button" class="chip" data-group="cargo" disabled>Cargo</button>
        <button type="button" class="chip" data-group="ferry" disabled>Ferries/Cruise</button>
        <button type="button" class="chip" data-group="fishing" disabled>Fishing</button>
        <button type="button" class="chip" data-group="pleasure" disabled>Pleasure craft</button>
      </div>
      <nav class="actions" aria-label="Site actions">
        <button id="btn-share" type="button">Share</button>
        <button id="btn-video" type="button" disabled title="Share video arrives with the data release">Video</button>
        <button id="btn-embed" type="button" disabled title="Embeddable page arrives with the scenes release">Embed</button>
        <a id="btn-about" href="./about.html">About</a>
      </nav>
    </header>

    <aside id="caption" class="caption" hidden></aside>

    <div class="controls" id="controls">
      <button id="btn-play" type="button" disabled title="Playback starts once data is loaded" aria-label="Play">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
      </button>
      <input id="slider" type="range" min="0" max="251" step="1" value="0" disabled aria-label="Month" />
      <span id="month-label" class="month-label">January 2006</span>
      <select id="speed" disabled aria-label="Playback speed">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="4" selected>4×</option>
      </select>
    </div>

    <footer class="site-footer">
      <span class="attr">
        Data: <a href="https://aisdata.ais.dk" rel="noopener">Danish Maritime Authority</a>
        <span aria-hidden="true">·</span> Land: <a href="https://www.naturalearthdata.com" rel="noopener">Natural Earth</a>
        <span aria-hidden="true">·</span> Map: <a href="https://maplibre.org" rel="noopener">MapLibre GL JS</a> +
        <a href="https://deck.gl" rel="noopener">deck.gl</a>
      </span>
      <a class="marespot" href="https://marespot.com" rel="noopener">A MareSpot experiment — live Adriatic wind, shelter &amp; sea temperature at marespot.com</a>
    </footer>
  </body>
</html>
